name: Android verification
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - name: Core, Lua, debug APK and lint
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon :core:test :lua:test :app:assembleDebug :app:testDebugUnitTest :app:lintDebug 2>&1 | tee verification.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error::%s\n' "$line"
            done < <(grep -E '^e:|[Ee]rror:|^FAIL |Execution failed|Could not|^> (A failure|There|Could|Process)' verification.log | head -40)
          fi
          grep -E 'Brazil MR (Core|Lua):|[0-9]+ tests completed' verification.log | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done || true
          exit "$result"
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          retention-days: 7
          path: |
            verification.log
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/ui/*.png
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BrazilMR-debug
          retention-days: 7
          path: app/build/outputs/apk/debug/*.apk
